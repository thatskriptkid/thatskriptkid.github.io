---
layout: default
---

<article class="post">
  <header class="post__header">
    <p class="terminal-line">cat {{ page.path }}</p>
    <small class="post__date">{{ page.date | date: "%-d %B %Y" }}</small>

    {% if page.tags %}
      <div class="tag-row" aria-label="Post tags">
        {% for tag in page.tags %}
          <span class="tag">{{ tag }}</span>
        {% endfor %}
      </div>
    {% endif %}

    <h1>{{ page.title }}</h1>
  </header>

  <div class="post__body">
    {{ content }}
  </div>
</article>
